services:
  mariadb:
    build: ./mariadb
    image: mariadb:inception
    restart: on-failure
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build: ./wordpress
    image: wordpress:inception
    restart: on-failure
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb

  nginx:
    build: ./nginx
    image: nginx:inception
    restart: on-failure
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

volumes:
  mariadb_data:
    driver_opts:
      type: none
      o: bind
      device: /home/eerriyag/data/mariadb
  wordpress_data:
    driver_opts:
      type: none
      o: bind
      device: /home/eerriyag/data/wordpress

networks:
  inception:
      driver: bridge 